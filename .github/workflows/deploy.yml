# Tests every push to master and, if everything passes, publishes the built app
# (only dist/) to GitHub Pages at https://boto-coder.github.io/dice/.
name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels an older run still in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browsers (with the system libraries WebKit needs)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full suite (types, lint, format, unit, fairness, e2e in Chromium)
        run: npm test
      - name: e2e under /dice/, as served on GitHub Pages
        run: npm run test:e2e
        env:
          BASE_PATH: /dice/
      - name: e2e in Firefox
        run: npm run test:firefox
      - name: e2e in WebKit (Safari's engine)
        run: npm run test:webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for /dice/
        run: npm run build
        env:
          BASE_PATH: /dice/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
