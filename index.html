<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D dice roller for tabletop RPGs and board games" />
    <meta name="theme-color" content="#0f1216" />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes
      // the wrong colours. Mirrors src/core/settings.ts (dark is the default).
      (function () {
        var theme = 'dark';
        try {
          var saved = JSON.parse(localStorage.getItem('dice-roller:settings') || 'null');
          var choice = saved && saved.version === 1 ? saved.theme : 'dark';
          if (choice === 'light') theme = 'light';
          if (choice === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'light';
          }
        } catch (e) {
          // Storage blocked or corrupt: keep dark.
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').content = '#f6f7f9';
        }
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Dice Roller</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
